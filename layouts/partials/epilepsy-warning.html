<!-- layouts/partials/epilepsy-warning.html -->
<div id="epilepsy-warning-overlay" class="epilepsy-warning-overlay">
  <div class="epilepsy-warning-box">
    <h1>⚠ Epilepsy / Flashing Content Warning</h1>

    <p>
      This website may contain flashing lights, rapid animations, bright colors,
      or visual effects that could trigger seizures or discomfort for people with
      photosensitive epilepsy.
    </p>

    <p>
      Please continue only if you are comfortable viewing this type of content.
    </p>

    <div class="epilepsy-warning-buttons">
      <button id="continue-site">Continue</button>

      <!-- Change this URL -->
      <a href="https://www.sergalmerps.org/">
        <button class="secondary">Go Back</button>
      </a>
    </div>
  </div>
</div>

<style>
  .epilepsy-warning-overlay {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.92);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999999;
    padding: 1rem;
  }

  .epilepsy-warning-box {
    max-width: 650px;
    width: 100%;
    background: #111;
    border: 2px solid #ff4444;
    border-radius: 18px;
    padding: 2rem;
    color: white;
    font-family: sans-serif;
    box-shadow: 0 0 40px rgba(255, 68, 68, 0.25);
    text-align: center;
  }

  .epilepsy-warning-box h1 {
    margin-top: 0;
    font-size: 2rem;
    color: #ff6666;
  }

  .epilepsy-warning-box p {
    line-height: 1.6;
    opacity: 0.9;
  }

  .epilepsy-warning-buttons {
    margin-top: 2rem;
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .epilepsy-warning-buttons button {
    padding: 0.9rem 1.6rem;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 600;
    transition: 0.2s ease;
  }

  #continue-site {
    background: #ff4444;
    color: white;
  }

  #continue-site:hover {
    background: #ff6666;
    transform: translateY(-2px);
  }

  .secondary {
    background: #2a2a2a;
    color: white;
  }

  .secondary:hover {
    background: #3a3a3a;
    transform: translateY(-2px);
  }
</style>

<script>
  const overlay = document.getElementById("epilepsy-warning-overlay");
  const continueBtn = document.getElementById("continue-site");

  // Prevent showing again after accepted
  if (localStorage.getItem("epilepsy-warning-accepted") === "true") {
    overlay.style.display = "none";
  }

  continueBtn.addEventListener("click", () => {
    localStorage.setItem("epilepsy-warning-accepted", "true");
    overlay.style.display = "none";
  });
</script>
